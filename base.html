<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Interview Buddy{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fb;--ink:#1b1f3b;--muted:#5d6385;--card:#fff;--accent:#3b5bdb;--ok:#2b8a3e;--line:#d9ddf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:28px 20px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}
label{font-weight:600;font-size:.9rem;display:block;margin:14px 0 6px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
textarea{min-height:140px;resize:vertical}
.btn,button{display:inline-block;font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
.ghost{background:#e8ecff;color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid #9bb0ff;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.q{font-size:1.3rem;font-weight:600;margin:0 0 16px}
.score{font-size:2.4rem;font-weight:700;color:var(--accent)}
.good{color:var(--ok)}
.hidden{display:none}
.flash{padding:12px 16px;border-radius:10px;background:#fff3bf;margin-bottom:16px}
.badge-success{color:#2b8a3e}.badge-primary{color:#3b5bdb}.badge-warning{color:#b35c00}.badge-danger{color:#c92a2a}
</style>
</head>
<body>
<main>
  <h1><a href="{{ url_for('start') }}" style="color:inherit;text-decoration:none">Interview Buddy</a></h1>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
